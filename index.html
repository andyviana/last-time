<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Last time</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Last time">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF1D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140E26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-v2-180.png">
<link rel="icon" type="image/png" href="icon-v2-192.png">
<style>
@font-face{
  font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;font-display:swap;
  src:url(bricolage.woff2) format('woff2');
}
:root{
  --bg:#FFF1D6; --surface:#FFFBF0; --ink:#1B1330; --muted:#5E5573; --rule:#E3D3B4;
  --accent:#6C4CF1; --accent-ink:#FFFFFF; --mark:#FFD84D; --mark-ink:#1B1330; --danger:#B3261E;
  --edge:#1B1330; --shadow:#1B1330;
  --toast-bg:#1B1330; --toast-ink:#FFF1D6; --toast-act:#FFD84D;
  --c1:#FF9F5A; --c2:#FF8FB8; --c3:#5FD6C6; --c4:#FFD84D; --c5:#B79CFF; --c6:#BFE860;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140E26; --surface:#221939; --ink:#F6EFE2; --muted:#B3A8CC; --rule:#3A2F57;
    --accent:#B9A6FF; --accent-ink:#140E26; --danger:#FF8F85;
    --edge:#54467A; --shadow:#05030B;
    --toast-bg:#F6EFE2; --toast-ink:#140E26; --toast-act:#5B3FD9;
  }
}
:root[data-theme="dark"]{
  --bg:#140E26; --surface:#221939; --ink:#F6EFE2; --muted:#B3A8CC; --rule:#3A2F57;
  --accent:#B9A6FF; --accent-ink:#140E26; --danger:#FF8F85;
  --edge:#54467A; --shadow:#05030B;
  --toast-bg:#F6EFE2; --toast-ink:#140E26; --toast-act:#5B3FD9;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.4 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
main{max-width:640px;margin:0 auto;padding:22px 16px 120px}
h2{margin:0 0 6px;font-weight:700;font-size:20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;margin:0 0 20px}
.capy{
  flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;
  border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);transform:rotate(-6deg);
}
h1{margin:0;font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;letter-spacing:-.03em}
h1 mark{
  color:var(--mark-ink);background:var(--mark);padding:0 .18em .04em;border-radius:.2em;
  display:inline-block;transform:rotate(-1.5deg);white-space:nowrap;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px;font-weight:500}

/* add */
.newbtn{
  width:100%;min-height:52px;border-radius:16px;border:2.5px solid var(--edge);
  background:var(--mark);color:var(--mark-ink);font-weight:800;font-size:17px;letter-spacing:-.01em;
  box-shadow:4px 4px 0 var(--shadow);margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s,box-shadow .08s;
}
.newbtn:active,.btn:active,.chip:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.newbtn[aria-expanded="true"]{background:var(--surface);color:var(--ink);margin-bottom:12px}
.add{
  background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);
  padding:14px;display:grid;gap:10px;margin-bottom:24px;
}
.add .line,.detail .line{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:13px;color:var(--muted);font-weight:500}
input,select{
  font:inherit;font-size:16px;color:inherit;background:var(--bg);border:2px solid var(--edge);
  border-radius:12px;padding:10px 12px;width:100%;min-height:46px;min-width:0;
}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{
  min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--edge);
  background:var(--surface);font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--shadow);
  transition:transform .08s,box-shadow .08s;
}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.linklike{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:500}
.linklike:hover{color:var(--ink)}

/* controls */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:2px solid var(--edge);background:var(--surface);border-radius:999px;
  padding:0 14px;min-height:38px;font-weight:600;font-size:14px;box-shadow:2px 2px 0 var(--shadow);
  transition:transform .08s,box-shadow .08s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.controls select{width:auto;min-height:38px;padding:4px 10px;font-size:14px;font-weight:600;margin-left:auto;border-radius:999px;background:var(--surface)}

/* list: every tracker is a sticker-coloured card; text on cards is always dark */
ul{list-style:none;margin:0;padding:0}
.cards{display:grid;gap:14px}
.item{
  --card:var(--c1);
  --ink:#1B1330; --muted:rgba(27,19,48,.78); --rule:rgba(27,19,48,.22);
  --bg:#FFFBF0; --surface:#FFFBF0; --accent:#1B1330; --accent-ink:#FFF1D6; --danger:#9E1D14;
  --edge:#1B1330;
  color:var(--ink);background:var(--card);border:2.5px solid #1B1330;border-radius:20px;
  box-shadow:5px 5px 0 var(--shadow);padding:0 14px;
}
.item.k1{--card:var(--c1)} .item.k2{--card:var(--c2)} .item.k3{--card:var(--c3)}
.item.k4{--card:var(--c4)} .item.k5{--card:var(--c5)} .item.k6{--card:var(--c6)}
.item .btn,.item .chip{box-shadow:2px 2px 0 #1B1330}
.row{display:flex;align-items:center;gap:10px}
.main{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 0;background:none;border:0;text-align:left;
}
.lbl{display:block;min-width:0;flex:1}
.name{display:block;font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.when{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:4px}
.note{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere;font-style:italic}
.meter{display:block;height:7px;border-radius:99px;background:var(--rule);margin-top:9px;max-width:220px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.ago{flex:none;min-width:70px;text-align:right}
.num{display:block;font-weight:800;font-size:46px;line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.unit{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
.ago.mark .num{
  display:inline-block;font-size:22px;line-height:1;padding:7px 10px;border-radius:10px;
  background:var(--surface);color:var(--ink);border:2px solid var(--ink);letter-spacing:-.01em;
  transform:rotate(-4deg);box-shadow:2px 2px 0 var(--ink);
}
.log{
  flex:none;width:50px;height:50px;border-radius:50%;border:2.5px solid #1B1330;
  background:#1B1330;color:#FFF1D6;display:grid;place-items:center;
  transition:transform .12s cubic-bezier(.3,1.6,.5,1);
}
.log:hover{transform:scale(1.06) rotate(90deg)}
.log:active{transform:scale(.88)}

/* detail */
.detail{display:grid;gap:20px;padding:6px 0 18px;border-top:2px dashed var(--rule)}
.detail>:first-child{margin-top:14px}
.block{display:grid;gap:10px}
.block .btn{justify-self:start}
.blk-title{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.stat{margin:0;color:var(--muted);font-size:15px}
.hist li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:9px 0;border-top:1.5px solid var(--rule)}
.hist li:first-child{border-top:0}
.hd{font-weight:700;font-variant-numeric:tabular-nums}
.hn{color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere;font-style:italic}
.hist .acts{margin-left:auto;display:flex;gap:14px}
details.edit summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;min-height:32px;display:flex;align-items:center}
.editbody{display:grid;gap:10px;padding-top:8px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:480px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.tl{display:grid;gap:4px}
.tl-track{position:relative;height:34px;margin:0 14px}
.tl-track::before{content:'';position:absolute;left:-14px;right:-14px;top:50%;height:3px;margin-top:-1.5px;background:var(--rule);border-radius:3px}
.tl-dot{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;display:grid;place-items:center}
.tl-dot::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--card)}
.tl-dot:hover::after{width:13px;height:13px}
.tl-dot[aria-pressed="true"]{z-index:1}
.tl-dot[aria-pressed="true"]::after{width:15px;height:15px;background:var(--surface);box-shadow:0 0 0 3px var(--ink)}
.tl-axis{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--muted)}
.tl-cap{margin:2px 0 0;font-size:14px;color:var(--muted);min-height:20px;overflow-wrap:anywhere}
.tl-cap b{color:var(--ink);font-weight:700}

/* sheet */
dialog.sheet{
  border:2.5px solid var(--edge);padding:0;background:var(--surface);color:var(--ink);border-radius:22px;
  width:calc(100% - 32px);max-width:480px;max-height:80vh;overflow:auto;
  margin:calc(env(safe-area-inset-top,0px) + 10vh) auto auto;box-shadow:6px 6px 0 var(--shadow);
}
dialog.sheet[open]{animation:pop .22s cubic-bezier(.3,1.4,.5,1)}
dialog.sheet::backdrop{background:rgba(12,7,26,.6)}
.sheetbody{display:grid;gap:14px;padding:20px 18px}
.sheetbody h2{margin:0;font-weight:800;font-size:24px;letter-spacing:-.02em}
.sheetbody .sub{margin:-10px 0 0;overflow-wrap:anywhere}
.quick{display:grid;gap:10px}
.quick .btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;min-height:54px}
.quick .btn small{color:var(--muted);font-weight:500;font-size:13px;flex:none}

/* footer + backup nudge */
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:26px;font-size:13px;color:var(--muted)}
.backupinfo{font-size:13px;margin:10px 0 0;color:var(--muted);line-height:1.9}
.nudge{
  font:inherit;font-size:13px;font-weight:700;border:2px solid var(--edge);border-radius:9px;padding:3px 9px;margin-right:8px;
  background:var(--mark);color:var(--mark-ink);box-shadow:2px 2px 0 var(--shadow);
}

.syncinfo{font-size:13px;margin:6px 0 0;color:var(--muted);line-height:1.6}
.syncinfo .linklike{font-size:13px}
.syncinfo.err{color:var(--danger)}
.btn:disabled{opacity:.6}

/* empty + misc */
.empty{padding:8px 0}
.empty p{margin:0 0 14px;color:var(--muted);max-width:44ch}
.muted{color:var(--muted)}
.status.err{color:var(--danger)}
.status .linklike{font-size:13px;color:inherit}
.banner{background:var(--surface);border:2.5px solid var(--edge);border-radius:16px;padding:14px;color:var(--danger)}

/* toast */
#toastwrap{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;
  opacity:0;transform:translateY(24px) scale(.96);visibility:hidden;
  transition:opacity .18s,transform .25s cubic-bezier(.3,1.5,.5,1),visibility 0s .25s;
}
#toastwrap.show{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.toast{
  pointer-events:auto;background:var(--toast-bg);color:var(--toast-ink);border-radius:16px;
  padding:13px 18px;display:flex;gap:18px;align-items:center;max-width:520px;
  box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:15px;font-weight:500;
}
.toast button{background:none;border:0;padding:4px 2px;color:var(--toast-act);font-weight:800;white-space:nowrap;flex:none}

/* motion */
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.cards.intro .item{animation:rise .4s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.spark{position:fixed;z-index:50;width:10px;height:10px;border-radius:3px;border:1.5px solid #1B1330;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  #toastwrap,.newbtn,.btn,.chip,.log{transition:none}
  .log:hover,.log:active,.newbtn:active,.btn:active,.chip:active{transform:none}
  dialog.sheet[open],.cards.intro .item{animation:none}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <img class="capy" src="icon-v2-180.png" alt="" width="64" height="64">
    <div>
      <h1>When was the <mark>last time?</mark></h1>
      <p class="sub" id="sub" hidden></p>
    </div>
  </header>

  <button class="newbtn" id="newBtn" type="button" aria-expanded="false" aria-controls="add" hidden>New tracker</button>

  <div class="add" id="add" hidden>
    <label class="field"><span>What do you want to track?</span>
      <input id="newName" type="text" maxlength="80" placeholder="Finished a deodorant stick" autocomplete="off">
    </label>
    <div class="line">
      <label class="field"><span>Group (optional)</span>
        <input id="newGroup" type="text" maxlength="40" list="groups" placeholder="Household" autocomplete="off">
      </label>
      <label class="field"><span>Last time (optional)</span>
        <input id="newDate" type="date">
      </label>
    </div>
    <button class="btn primary" id="addBtn" type="button" style="justify-self:start">Add tracker</button>
  </div>
  <datalist id="groups"></datalist>

  <div class="controls" id="controls" hidden></div>
  <div id="list"><p class="muted">Loading…</p></div>

  <div class="meta">
    <span id="foot"><button class="linklike" id="backupBtn" type="button">Back up</button> &nbsp; <button class="linklike" id="restoreBtn" type="button">Restore</button></span>
    <span class="status" id="status" role="status"></span>
  </div>
  <p class="backupinfo" id="backupInfo">Everything is saved on this phone only. Back up now and then.</p>
  <p class="syncinfo" id="syncInfo"></p>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
</main>

<dialog class="sheet" id="sheet"></dialog>

<div id="toastwrap" role="status" aria-live="polite"><div class="toast" id="toast"></div></div>

<script>
(function(){
'use strict';

var KEY='lasttime:v1', UIKEY='lasttime:ui';
var DAY=86400000;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v=attrs[k];
      if(v==null||v===false) return;
      if(k==='class') el.className=v;
      else if(k==='value') el.value=v;
      else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
      else el.setAttribute(k,v===true?'':v);
    });
  }
  var kids=Array.prototype.slice.call(arguments,2);
  (function add(list){
    list.forEach(function(kid){
      if(kid==null||kid===false) return;
      if(Array.isArray(kid)) return add(kid);
      el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    });
  })(kids);
  return el;
}
function plusIcon(){
  var ns='http://www.w3.org/2000/svg';
  var s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width','22');s.setAttribute('height','22');
  s.setAttribute('aria-hidden','true');
  var p=document.createElementNS(ns,'path');
  p.setAttribute('d','M12 5v14M5 12h14');p.setAttribute('stroke','currentColor');
  p.setAttribute('stroke-width','2.2');p.setAttribute('stroke-linecap','round');p.setAttribute('fill','none');
  s.appendChild(p);return s;
}
function pad(n){return String(n).padStart(2,'0');}
function isoDate(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function daysSince(t){return Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);}
function dateFromInput(str){
  var p=str.split('-').map(Number);
  var t=new Date(p[0],p[1]-1,p[2],12,0,0).getTime();
  if(startOfDay(t)===startOfDay(Date.now())) return Date.now();
  return Math.min(t,Date.now());
}
function fmtDate(t,long){
  var d=new Date(t),now=new Date();
  var o={month:'short',day:'numeric'};
  if(long) o.weekday='short';
  if(d.getFullYear()!==now.getFullYear()) o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}
function ago(t){
  var d=Math.max(0,daysSince(t));
  if(d===0) return {num:'Today',unit:'',mark:true};
  if(d<90) return {num:String(d),unit:d===1?'day ago':'days ago'};
  if(d<730){var m=Math.floor(d/30.4375);return {num:String(m),unit:m===1?'month ago':'months ago'};}
  var y=Math.floor(d/365.25);
  return {num:String(y),unit:y===1?'year ago':'years ago'};
}
function spanTxt(d){
  if(d===1) return '1 day';
  if(d<90) return d+' days';
  if(d<730) return Math.round(d/30.4375)+' months';
  return (d/365.25).toFixed(1)+' years';
}
function lastOf(it){
  var m=null;
  it.log.forEach(function(e){if(m===null||e.t>m) m=e.t;});
  return m;
}
function stats(it){
  /* gaps are counted between distinct days, so two logs on one day don't skew them */
  var seen={},days=[];
  it.log.forEach(function(e){var d=startOfDay(e.t);if(!seen[d]){seen[d]=1;days.push(d);}});
  days.sort(function(a,b){return a-b;});
  var gaps=[],i;
  for(i=1;i<days.length;i++) gaps.push(Math.round((days[i]-days[i-1])/DAY));
  var out={n:it.log.length,gaps:gaps.length,avg:null,min:null,max:null};
  if(gaps.length){
    out.avg=Math.max(1,Math.round(gaps.reduce(function(a,b){return a+b;},0)/gaps.length));
    out.min=Math.min.apply(null,gaps);
    out.max=Math.max.apply(null,gaps);
  }
  return out;
}

/* ---------- state ---------- */
var state={items:[],deleted:{items:{},entries:{}}};
var store=null, canSave=false;
var ui={open:null,group:'All',sort:'recent',showAll:{},adding:false,intro:true};
try{
  var u=JSON.parse(localStorage.getItem(UIKEY)||'null');
  if(u){
    if(typeof u.group==='string') ui.group=u.group;
    if(['recent','oldest','az'].indexOf(u.sort)>=0) ui.sort=u.sort;
  }
}catch(e){}
function saveUi(){try{localStorage.setItem(UIKEY,JSON.stringify({group:ui.group,sort:ui.sort}));}catch(e){}}
function byId(id){return state.items.filter(function(i){return i.id===id;})[0];}

function normalize(d){
  var out=[],src=d&&Array.isArray(d.items)?d.items:[];
  src.forEach(function(it){
    if(!it||typeof it.name!=='string') return;
    var log=[];
    (Array.isArray(it.log)?it.log:[]).forEach(function(e){
      if(e&&typeof e.t==='number'&&isFinite(e.t)){
        log.push({id:typeof e.id==='string'?e.id:uid(),t:e.t,note:typeof e.note==='string'?e.note:'',m:typeof e.m==='number'&&isFinite(e.m)?e.m:0});
      }
    });
    out.push({id:typeof it.id==='string'?it.id:uid(),name:it.name,group:typeof it.group==='string'?it.group:'',m:typeof it.m==='number'&&isFinite(it.m)?it.m:0,log:log});
  });
  return out;
}
/* deletions are remembered (id -> when) so they can carry over to other devices */
function normalizeDeleted(d){
  var out={items:{},entries:{}},src=d&&d.deleted&&typeof d.deleted==='object'?d.deleted:{};
  ['items','entries'].forEach(function(k){
    var o=src[k];
    if(o&&typeof o==='object') Object.keys(o).forEach(function(id){
      if(typeof o[id]==='number'&&isFinite(o[id])) out[k][id]=o[id];
    });
  });
  return out;
}
function killEntry(it,eid){
  it.log=it.log.filter(function(x){return x.id!==eid;});
  state.deleted.entries[eid]=Date.now();
}
function reviveEntry(it,e){
  e.m=Date.now();delete state.deleted.entries[e.id];
  if(!it.log.some(function(x){return x.id===e.id;})) it.log.push(e);
}

/* ---------- storage ---------- */
function readLocal(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  var none={items:{},entries:{}};
  if(!raw) return {ok:true,items:[],deleted:none};
  try{var p=JSON.parse(raw);return {ok:true,items:normalize(p),deleted:normalizeDeleted(p)};}
  catch(e){return {ok:false,items:[],deleted:none};}
}
async function write(body){
  localStorage.setItem(KEY,JSON.stringify(body));
}
var saving=false,dirty=false;
function setStatus(kind){
  var s=$('#status');
  s.replaceChildren();
  s.className='status'+(kind==='error'?' err':'');
  if(kind==='saving') s.textContent='Saving…';
  else if(kind==='saved') s.textContent='Saved';
  else if(kind==='error'){
    s.append('Couldn’t save. ',h('button',{class:'linklike',type:'button',onclick:function(){save();}},'Retry'));
  }
}
async function flush(){
  saving=true;setStatus('saving');
  var ok=true;
  while(dirty){
    dirty=false;
    try{await write({v:1,items:state.items,deleted:state.deleted});ok=true;}catch(e){ok=false;}
  }
  saving=false;setStatus(ok?'saved':'error');
}
function save(fromSync){
  if(!canSave) return;
  dirty=true;
  if(!saving) flush();
  if(!fromSync) scheduleSync();
}

/* ---------- toast ---------- */
var toastTimer;
function hideToast(){$('#toastwrap').classList.remove('show');}
function toast(msg,undo,extra){
  var t=$('#toast');
  t.replaceChildren();
  t.append(h('span',null,msg));
  if(extra) t.append(h('button',{type:'button',onclick:function(){hideToast();extra.fn();}},extra.label));
  if(undo) t.append(h('button',{type:'button',onclick:function(){undo();hideToast();}},'Undo'));
  $('#toastwrap').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,extra?8000:undo?6000:2500);
}

/* ---------- backup reminder ---------- */
var METAKEY='lasttime:meta';
function getMeta(){
  try{var m=JSON.parse(localStorage.getItem(METAKEY)||'{}');return m&&typeof m==='object'?m:{};}
  catch(e){return {};}
}
function setBackedUp(t){
  var m=getMeta();m.lastBackup=t;
  try{localStorage.setItem(METAKEY,JSON.stringify(m));}catch(e){}
  renderBackupInfo();
}
function renderBackupInfo(){
  var el=$('#backupInfo');if(!el) return;
  var base=getSync()?'Saved on this device and synced to your private GitHub repo.':'Everything is saved on this device only.';
  var hasLogs=state.items.some(function(i){return i.log.length;});
  var lb=getMeta().lastBackup;
  if(!canSave||!hasLogs){el.replaceChildren(base+' Back up now and then.');return;}
  function nudge(txt){return h('button',{class:'nudge',type:'button',onclick:exportData},txt);}
  if(typeof lb!=='number'){el.replaceChildren(nudge('Not backed up yet'),base+' Tap to back up.');return;}
  var d=Math.max(0,daysSince(lb));
  var when=d===0?'today':d===1?'yesterday':spanTxt(d)+' ago';
  if(d>30) el.replaceChildren(nudge('Last backup: '+when),'Time for a fresh one. '+base);
  else el.replaceChildren('Last backup: '+when+'. '+base);
}

/* ---------- actions ---------- */
function commit(focus){save();render(focus?{focus:focus}:{});}

function addTracker(name,group,dateStr){
  name=name.trim();
  if(!name) return false;
  var it={id:uid(),name:name,group:(group||'').trim(),log:[]};
  if(dateStr) it.log.push({id:uid(),t:dateFromInput(dateStr),note:''});
  state.items.push(it);
  if(ui.group!=='All'&&it.group!==ui.group){ui.group='All';saveUi();}
  commit();
  var el=document.querySelector('[data-f="row:'+it.id+'"]');
  if(el) el.scrollIntoView({block:'nearest'});
  toast('Added “'+name+'”');
  return true;
}
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(id){
  if(calm) return;
  var btn=document.querySelector('[data-f="log:'+id+'"]');
  if(!btn||!btn.animate) return;
  var li=btn.closest('.item'),num=li&&li.querySelector('.ago');
  if(num) num.animate([{transform:'scale(.6) rotate(-8deg)'},{transform:'scale(1.15) rotate(3deg)'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.3,1.5,.5,1)'});
  var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var cols=['#FF9F5A','#FF8FB8','#5FD6C6','#FFD84D','#B79CFF','#BFE860','#FFFBF0'];
  for(var i=0;i<12;i++){(function(i){
    var s=h('span',{class:'spark','aria-hidden':'true'});
    s.style.left=(cx-5)+'px';s.style.top=(cy-5)+'px';s.style.background=cols[i%cols.length];
    if(i%3===0) s.style.borderRadius='50%';
    document.body.append(s);
    var ang=(i/12)*Math.PI*2+Math.random()*.5,dist=46+Math.random()*44;
    var a=s.animate([
      {transform:'translate(0,0) scale(.4) rotate(0deg)',opacity:1},
      {transform:'translate('+Math.cos(ang)*dist+'px,'+(Math.sin(ang)*dist-10)+'px) scale(1) rotate('+(Math.random()*360-180)+'deg)',opacity:1,offset:.6},
      {transform:'translate('+Math.cos(ang)*dist*1.15+'px,'+(Math.sin(ang)*dist*1.15+24)+'px) scale(.5) rotate('+(Math.random()*540-270)+'deg)',opacity:0}
    ],{duration:620+Math.random()*180,easing:'cubic-bezier(.2,.7,.3,1)'});
    a.onfinish=a.oncancel=function(){s.remove();};
  })(i);}
}
function logNow(id){
  var it=byId(id);if(!it) return;
  var e={id:uid(),t:Date.now(),note:''};
  it.log.push(e);
  commit('log:'+id);
  celebrate(id);
  toast('Logged “'+it.name+'”',function(){
    var c=byId(id);
    if(c){killEntry(c,e.id);commit();}
  },{label:'Date / note',fn:function(){openEntrySheet(id,e.id,true);}});
}
function updateEntry(id,eid,t,note){
  var it=byId(id);if(!it) return;
  var e=it.log.filter(function(x){return x.id===eid;})[0];
  if(!e) return;
  var old={t:e.t,note:e.note};
  if(old.t===t&&old.note===note) return;
  e.t=t;e.note=note;e.m=Date.now();
  commit('row:'+id);
  toast('Saved '+fmtDate(t)+' for “'+it.name+'”',function(){
    var c=byId(id);if(!c) return;
    var x=c.log.filter(function(y){return y.id===eid;})[0];
    if(x){x.t=old.t;x.note=old.note;x.m=Date.now();commit('row:'+id);}
  });
}
function addEntry(id,t,note){
  var it=byId(id);if(!it) return;
  var e={id:uid(),t:t,note:note||''};
  it.log.push(e);
  commit('row:'+id);
  toast('Logged '+fmtDate(t)+' for “'+it.name+'”',function(){
    var c=byId(id);
    if(c){killEntry(c,e.id);commit('row:'+id);}
  });
}
function removeEntry(id,eid){
  var it=byId(id);if(!it) return;
  var e=it.log.filter(function(x){return x.id===eid;})[0];
  if(!e) return;
  killEntry(it,eid);
  commit('row:'+id);
  toast('Entry removed',function(){
    var c=byId(id);
    if(c){reviveEntry(c,e);commit('row:'+id);}
  });
}
function updateItem(id,name,group){
  var it=byId(id);if(!it) return;
  it.name=name;it.group=group;it.m=Date.now();
  commit('row:'+id);
}
function deleteItem(id){
  var idx=state.items.findIndex(function(i){return i.id===id;});
  if(idx<0) return;
  var it=state.items.splice(idx,1)[0];
  if(ui.open===id) ui.open=null;
  state.deleted.items[id]=Date.now();
  commit();
  toast('Deleted “'+it.name+'”',function(){
    if(byId(id)) return;
    it.m=Date.now();delete state.deleted.items[id];
    state.items.splice(Math.min(idx,state.items.length),0,it);
    commit();
  });
}

/* ---------- sheets ---------- */
var sheet=$('#sheet');
function closeSheet(){if(sheet.open) sheet.close();}
function openSheet(body){
  sheet.replaceChildren(body);
  if(sheet.open) return;
  if(typeof sheet.showModal==='function') sheet.showModal();
  else sheet.setAttribute('open','');
}
sheet.addEventListener('click',function(e){if(e.target===sheet) closeSheet();});

function openEntrySheet(id,eid,fresh){
  var it=byId(id);if(!it) return;
  var e=it.log.filter(function(x){return x.id===eid;})[0];
  if(!e) return;
  var today=isoDate(Date.now());
  var dateIn=h('input',{type:'date',max:today,value:isoDate(e.t)});
  var noteIn=h('input',{type:'text',maxlength:'120',value:e.note,placeholder:'Flu, 4 days',autocomplete:'off'});
  var quick=[['Today',0],['Yesterday',1],['2 days ago',2],['3 days ago',3]];
  var chips=h('div',{class:'chips',role:'group','aria-label':'Quick dates'});
  function paint(){
    Array.prototype.forEach.call(chips.children,function(c,i){
      c.setAttribute('aria-pressed',String(dateIn.value===isoDate(Date.now()-quick[i][1]*DAY)));
    });
  }
  quick.forEach(function(q){
    chips.append(h('button',{class:'chip',type:'button',onclick:function(){
      dateIn.value=isoDate(Date.now()-q[1]*DAY);paint();
    }},q[0]));
  });
  dateIn.addEventListener('input',paint);
  paint();
  function submit(){
    if(!dateIn.value){dateIn.focus();return;}
    /* keep the original time of day unless the day itself changed */
    var t=dateIn.value===isoDate(e.t)?e.t:dateFromInput(dateIn.value);
    closeSheet();
    updateEntry(id,eid,t,noteIn.value.trim());
  }
  noteIn.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();submit();}});
  openSheet(h('div',{class:'sheetbody'},
    h('h2',null,fresh?'When was it?':'Edit entry'),
    h('p',{class:'sub'},it.name),
    chips,
    h('label',{class:'field'},h('span',null,'Date'),dateIn),
    h('label',{class:'field'},h('span',null,'Note for this time (optional)'),noteIn),
    h('div',{class:'btnrow'},
      h('button',{class:'btn primary',type:'button',onclick:submit},'Save'),
      h('button',{class:'btn',type:'button',onclick:closeSheet},'Cancel'))));
}

function openQuickSheet(){
  var items=state.items.slice().sort(function(a,b){return b.log.length-a.log.length;}).slice(0,8);
  if(!items.length) return;
  openSheet(h('div',{class:'sheetbody'},
    h('h2',null,'Quick log'),
    h('p',{class:'sub'},'Tap one to log it right now.'),
    h('div',{class:'quick'},items.map(function(it){
      var l=lastOf(it),a=l===null?null:ago(l);
      return h('button',{class:'btn',type:'button',onclick:function(){closeSheet();logNow(it.id);}},
        h('span',null,it.name),
        h('small',null,a?(a.unit?a.num+' '+a.unit:a.num):'not logged'));
    })),
    h('div',{class:'btnrow'},h('button',{class:'btn',type:'button',onclick:closeSheet},'Cancel'))));
}

/* ---------- render ---------- */
function render(o){
  o=o||{};
  renderTop();
  renderControls();
  renderList();
  renderBackupInfo();
  renderSyncInfo();
  if(o.focus){
    var el=document.querySelector('[data-f="'+o.focus+'"]');
    if(el) el.focus({preventScroll:true});
  }
}

function renderTop(){
  var open=ui.adding||!state.items.length;
  var nb=$('#newBtn');
  $('#add').hidden=!canSave||!open;
  nb.hidden=!canSave||!state.items.length;
  nb.setAttribute('aria-expanded',String(ui.adding));
  nb.replaceChildren(ui.adding?'Close':h('span',{'aria-hidden':'true'},'+'),ui.adding?'':' New tracker');
  var sub=$('#sub'),n=state.items.length;
  if(!n){sub.hidden=true;return;}
  var monthStart=new Date();monthStart.setDate(1);monthStart.setHours(0,0,0,0);
  var logs=0;
  state.items.forEach(function(it){it.log.forEach(function(e){if(e.t>=monthStart.getTime()) logs++;});});
  sub.hidden=false;
  sub.textContent=n+(n===1?' tracker':' trackers')+' · '+logs+' logged this month';
}
/* colour follows the group (or the name when there is no group), so it never changes with sorting */
function colourOf(it){
  var key=(it.group||it.name).toLowerCase(),x=0,i;
  for(i=0;i<key.length;i++) x=(x*31+key.charCodeAt(i))>>>0;
  return 'k'+(x%6+1);
}

function renderControls(){
  var groups=Array.from(new Set(state.items.map(function(i){return i.group;}).filter(Boolean)))
    .sort(function(a,b){return a.localeCompare(b);});
  if(ui.group!=='All'&&groups.indexOf(ui.group)<0){ui.group='All';saveUi();}
  $('#groups').replaceChildren.apply($('#groups'),groups.map(function(g){return h('option',{value:g});}));
  var c=$('#controls');
  c.replaceChildren();
  if(!state.items.length){c.hidden=true;return;}
  c.hidden=false;
  if(groups.length){
    var chips=h('div',{class:'chips',role:'group','aria-label':'Filter by group'});
    ['All'].concat(groups).forEach(function(g){
      chips.append(h('button',{class:'chip',type:'button','aria-pressed':String(ui.group===g),
        onclick:function(){ui.group=g;saveUi();render();}},g));
    });
    c.append(chips);
  }
  if(state.items.length>1){
    var opts=[['recent','Most recent'],['oldest','Longest ago'],['az','A to Z']];
    c.append(h('select',{'aria-label':'Sort trackers',onchange:function(e){ui.sort=e.target.value;saveUi();render();}},
      opts.map(function(p){return h('option',{value:p[0],selected:ui.sort===p[0]},p[1]);})));
  }
}

function renderList(){
  var list=$('#list');
  list.replaceChildren();
  if(!state.items.length){list.append(emptyState());return;}
  var last={};
  state.items.forEach(function(it){last[it.id]=lastOf(it);});
  var items=state.items.filter(function(it){return ui.group==='All'||it.group===ui.group;});
  items.sort(function(a,b){
    if(ui.sort==='az') return a.name.localeCompare(b.name,undefined,{sensitivity:'base'});
    var la=last[a.id],lb=last[b.id];
    if(la===null&&lb===null) return a.name.localeCompare(b.name);
    if(la===null) return 1;
    if(lb===null) return -1;
    return ui.sort==='oldest'?la-lb:lb-la;
  });
  var ul=h('ul',{class:'cards'+(ui.intro?' intro':'')});
  ui.intro=false;
  items.forEach(function(it,i){var li=rowEl(it,last[it.id]);li.style.setProperty('--i',Math.min(i,12));ul.append(li);});
  list.append(ul);
}

function emptyState(){
  var presets=['Finished a deodorant stick','Finished a box of Q-tips','Got sick','Haircut','Changed the air filter'];
  return h('div',{class:'empty'},
    h('h2',null,'Nothing tracked yet'),
    h('p',null,'Add anything you catch yourself wondering about. Tap + on a row to log it right now.'),
    h('div',{class:'chips'},presets.map(function(p){
      return h('button',{class:'chip',type:'button',onclick:function(){addTracker(p,'','');}},p);
    })));
}

function rowEl(it,last){
  var open=ui.open===it.id;
  var a=last===null?{num:'–',unit:'not logged'}:ago(last);
  var latest=null;
  it.log.forEach(function(e){if(!latest||e.t>latest.t) latest=e;});
  var st=stats(it),usual=st.gaps>=2?st.avg:null; /* one gap isn't a habit yet */
  var main=h('button',{class:'main',type:'button','aria-expanded':String(open),'data-f':'row:'+it.id,
      onclick:function(){ui.open=open?null:it.id;render({focus:'row:'+it.id});}},
    h('span',{class:'lbl'},
      h('span',{class:'name'},it.name),
      h('span',{class:'when'},latest?fmtDate(latest.t)+(usual?' · usually every '+spanTxt(usual):''):'Nothing logged yet'),
      latest&&latest.note?h('span',{class:'note'},latest.note):null,
      usual?h('span',{class:'meter','aria-hidden':'true'},h('i',{style:'width:'+Math.max(4,Math.min(100,Math.round(Math.max(0,daysSince(latest.t))/usual*100)))+'%'})):null),
    h('span',{class:'ago'+(a.mark?' mark':'')},
      h('span',{class:'num'},a.num),
      a.unit?h('span',{class:'unit'},a.unit):null));
  var log=h('button',{class:'log',type:'button','aria-label':'Log '+it.name+' now',title:'Log now','data-f':'log:'+it.id,
    onclick:function(){logNow(it.id);}},plusIcon());
  return h('li',{class:'item '+colourOf(it)+(open?' open':'')},h('div',{class:'row'},main,log),open?detail(it):null);
}

function timeline(it){
  var es=it.log.slice().sort(function(a,b){return a.t-b.t;});
  if(es.length<2) return null;
  var t0=es[0].t,t1=Math.max(Date.now(),es[es.length-1].t),span=Math.max(t1-t0,DAY);
  var hint='Each dot is one time. Tap a dot for its date.';
  var cap=h('p',{class:'tl-cap','aria-live':'polite'},hint);
  var track=h('div',{class:'tl-track',role:'group','aria-label':'Timeline of every time logged'});
  var picked=null;
  function show(e,btn,stick){
    if(stick){
      if(picked) picked.setAttribute('aria-pressed','false');
      picked=btn;btn.setAttribute('aria-pressed','true');
    }
    var a=ago(e.t);
    cap.replaceChildren(h('b',null,fmtDate(e.t,true)),' · '+(a.unit?a.num+' '+a.unit:a.num.toLowerCase())+(e.note?' · '+e.note:''));
  }
  es.forEach(function(e){
    var pct=((e.t-t0)/span*100).toFixed(2);
    var btn=h('button',{class:'tl-dot',type:'button',style:'left:'+pct+'%','aria-pressed':'false',
      'aria-label':fmtDate(e.t,true)+(e.note?', '+e.note:''),
      onclick:function(){show(e,btn,true);},
      onmouseenter:function(){show(e,btn,false);}});
    track.append(btn);
  });
  return h('div',{class:'tl'},track,
    h('div',{class:'tl-axis'},h('span',null,fmtDate(t0)),h('span',null,'Today')),
    cap);
}

function detail(it){
  var s=stats(it);
  var today=isoDate(Date.now());
  var dateIn=h('input',{type:'date',max:today,value:today,'aria-label':'Date'});
  var noteIn=h('input',{type:'text',maxlength:'120',placeholder:'Note (optional)','aria-label':'Note',autocomplete:'off'});
  function submit(){
    if(!dateIn.value) return;
    addEntry(it.id,dateFromInput(dateIn.value),noteIn.value.trim());
  }
  noteIn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit();}});

  var statsBlock=null;
  if(s.n===1) statsBlock=h('p',{class:'stat'},'Logged once. Stats show up after the second time.');
  else if(s.n>1){
    var dash='–';
    var tile=function(v,l){return h('div',{class:'tile'},h('b',null,v),h('span',null,l));};
    statsBlock=h('div',{class:'block'},
      h('div',{class:'blk-title'},'Stats'),
      h('div',{class:'tiles'},
        tile(String(s.n),'times logged'),
        tile(s.avg?spanTxt(s.avg):dash,'usual gap'),
        tile(s.min!==null?spanTxt(s.min):dash,'shortest gap'),
        tile(s.max!==null?spanTxt(s.max):dash,'longest gap')),
      timeline(it));
  }

  var entries=it.log.slice().sort(function(a,b){return b.t-a.t;});
  var showAll=!!ui.showAll[it.id];
  var shown=showAll?entries:entries.slice(0,5);
  var hist=entries.length?h('ul',{class:'hist'},shown.map(function(e){
    return h('li',null,
      h('span',{class:'hd'},fmtDate(e.t,true)),
      e.note?h('span',{class:'hn'},e.note):null,
      h('span',{class:'acts'},
        h('button',{class:'linklike',type:'button','aria-label':'Edit entry from '+fmtDate(e.t,true),
          onclick:function(){openEntrySheet(it.id,e.id,false);}},'Edit'),
        h('button',{class:'linklike',type:'button','aria-label':'Remove entry from '+fmtDate(e.t,true),
          onclick:function(){removeEntry(it.id,e.id);}},'Remove')));
  })):null;
  var more=entries.length>5?h('button',{class:'linklike',type:'button',
    onclick:function(){ui.showAll[it.id]=!showAll;render({focus:'row:'+it.id});}},
    showAll?'Show fewer':'Show all '+entries.length):null;

  var nameIn=h('input',{type:'text',maxlength:'80',value:it.name,'aria-label':'Name'});
  var groupIn=h('input',{type:'text',maxlength:'40',value:it.group,list:'groups',placeholder:'Group (optional)','aria-label':'Group',autocomplete:'off'});
  var armed=false,timer;
  var delBtn=h('button',{class:'btn danger',type:'button',onclick:function(){
    if(!armed){
      armed=true;delBtn.textContent='Tap again to delete';delBtn.classList.add('armed');
      timer=setTimeout(function(){armed=false;delBtn.textContent='Delete tracker';delBtn.classList.remove('armed');},4000);
    }else{clearTimeout(timer);deleteItem(it.id);}
  }},'Delete tracker');
  var saveBtn=h('button',{class:'btn',type:'button',onclick:function(){
    var n=nameIn.value.trim();
    if(!n){nameIn.focus();return;}
    updateItem(it.id,n,groupIn.value.trim());
  }},'Save changes');

  return h('div',{class:'detail'},
    statsBlock,
    h('div',{class:'block'},
      h('div',{class:'blk-title'},'Log another day'),
      h('div',{class:'line'},dateIn,noteIn),
      h('button',{class:'btn primary',type:'button',onclick:submit},'Log')),
    hist?h('div',{class:'block'},h('div',{class:'blk-title'},'History'),hist,more):null,
    h('details',{class:'edit'},
      h('summary',null,'Rename, regroup or delete'),
      h('div',{class:'editbody'},nameIn,groupIn,h('div',{class:'btnrow'},saveBtn,delBtn))));
}

/* ---------- add form ---------- */
var nameEl=$('#newName'),groupEl=$('#newGroup'),dateEl=$('#newDate');
dateEl.max=isoDate(Date.now());
function submitAdd(){
  if(!canSave) return;
  if(!nameEl.value.trim()){nameEl.focus();return;}
  if(addTracker(nameEl.value,groupEl.value,dateEl.value)){
    nameEl.value='';groupEl.value='';dateEl.value='';
    nameEl.focus({preventScroll:true});
  }
}
$('#addBtn').addEventListener('click',submitAdd);
$('#newBtn').addEventListener('click',function(){
  ui.adding=!ui.adding;renderTop();
  if(ui.adding) nameEl.focus();
});
[nameEl,groupEl].forEach(function(el){
  el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitAdd();}});
});

/* ---------- backup / restore ---------- */
function backupName(){return 'last-time-backup-'+isoDate(Date.now())+'.json';}
async function exportData(){
  var json=JSON.stringify({v:1,items:state.items,deleted:state.deleted},null,2);
  try{
    var file=new File([json],backupName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Last time backup'});
      setBackedUp(Date.now());
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError') return;
  }
  var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  var a=h('a',{href:url,download:backupName()});
  document.body.append(a);a.click();a.remove();
  setBackedUp(Date.now());
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    var incoming;
    try{incoming=normalize(JSON.parse(String(r.result)));}
    catch(e){toast('That file isn’t a Last time backup');return;}
    /* a fresh install restoring from a file: that file is the latest backup */
    if(typeof getMeta().lastBackup!=='number'&&!state.items.length&&file.lastModified) setBackedUp(Math.min(file.lastModified,Date.now()));
    var addedItems=0,addedEntries=0;
    incoming.forEach(function(inc){
      var cur=byId(inc.id),now=Date.now();
      function back(e){if(state.deleted.entries[e.id]!=null){delete state.deleted.entries[e.id];e.m=now;}}
      if(!cur){
        if(state.deleted.items[inc.id]!=null){delete state.deleted.items[inc.id];inc.m=now;}
        inc.log.forEach(back);
        state.items.push(inc);addedItems++;addedEntries+=inc.log.length;return;
      }
      var have={};cur.log.forEach(function(e){have[e.id]=1;});
      inc.log.forEach(function(e){if(!have[e.id]){back(e);cur.log.push(e);addedEntries++;}});
    });
    if(addedItems||addedEntries){commit();toast('Restored '+addedItems+' trackers, '+addedEntries+' entries');}
    else toast('Nothing new in that file');
  };
  r.readAsText(file);
}
$('#backupBtn').addEventListener('click',exportData);
$('#restoreBtn').addEventListener('click',function(){$('#restoreFile').click();});
$('#restoreFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  if(f) importData(f);
  e.target.value='';
});

/* ---------- sync (optional) ----------
   The list is kept as one file in a PRIVATE GitHub repo that you own. Each device
   merges its list with that file, so logs, edits and deletions carry across.
   The access token lives only in this device's storage, never in the app's code. */
var SYNCKEY='lasttime:sync', SYNCFILE='data.json';
var API='https://api.github.com';
function getSync(){
  try{var c=JSON.parse(localStorage.getItem(SYNCKEY)||'null');return c&&typeof c.token==='string'&&typeof c.repo==='string'?c:null;}
  catch(e){return null;}
}
function setSync(c){
  try{if(c) localStorage.setItem(SYNCKEY,JSON.stringify(c));else localStorage.removeItem(SYNCKEY);}catch(e){}
}
function b64enc(str){
  var b=new TextEncoder().encode(str),out='',i;
  for(i=0;i<b.length;i+=0x8000) out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(out);
}
function b64dec(b64){
  var bin=atob(String(b64).replace(/\s/g,'')),b=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function canonical(d){
  function sortKeys(o){var r={};Object.keys(o).sort().forEach(function(k){r[k]=o[k];});return r;}
  return JSON.stringify({
    items:d.items.slice().sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0;}).map(function(it){
      return {id:it.id,name:it.name,group:it.group,m:it.m||0,
        log:it.log.slice().sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0;}).map(function(e){return {id:e.id,t:e.t,note:e.note,m:e.m||0};})};
    }),
    deleted:{items:sortKeys(d.deleted.items),entries:sortKeys(d.deleted.entries)}
  });
}
/* union of both sides; the most recently edited copy of anything wins; deletions win
   unless the thing was edited or restored after it was deleted */
function mergeData(a,b){
  var del={items:{},entries:{}};
  [a.deleted,b.deleted].forEach(function(d){
    ['items','entries'].forEach(function(k){
      Object.keys(d[k]).forEach(function(id){del[k][id]=Math.max(del[k][id]||0,d[k][id]);});
    });
  });
  var map={},order=[];
  function take(it){
    var cur=map[it.id];
    if(!cur){cur=map[it.id]={id:it.id,name:it.name,group:it.group,m:it.m||0,e:{},eo:[]};order.push(it.id);}
    else if((it.m||0)>cur.m){cur.name=it.name;cur.group=it.group;cur.m=it.m||0;}
    it.log.forEach(function(e){
      var ce=cur.e[e.id];
      if(!ce) cur.eo.push(e.id);
      if(!ce||(e.m||0)>ce.m) cur.e[e.id]={id:e.id,t:e.t,note:e.note,m:e.m||0};
    });
  }
  a.items.forEach(take);b.items.forEach(take);
  var items=[];
  order.forEach(function(id){
    var c=map[id];
    if(del.items[id]!=null&&del.items[id]>=c.m) return;
    var log=[];
    c.eo.forEach(function(eid){
      var e=c.e[eid];
      if(del.entries[eid]!=null&&del.entries[eid]>=e.m) return;
      log.push(e);
    });
    items.push({id:c.id,name:c.name,group:c.group,m:c.m,log:log});
  });
  return {items:items,deleted:del};
}

var syncing=false,syncAgain=false,syncTimer=null,syncView={kind:'idle',msg:''};
function ghFetch(cfg,path,opt){
  opt=opt||{};
  var headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28'};
  if(opt.body) headers['Content-Type']='application/json';
  return fetch(API+'/repos/'+cfg.repo+path,{method:opt.method||'GET',headers:headers,body:opt.body,cache:'no-store'});
}
function syncProblem(status){
  if(status===401) return 'GitHub rejected the token. It may have expired. Set up sync again with a new one.';
  if(status===403) return 'GitHub refused. The token needs “Contents: Read and write” on the data repo.';
  if(status===404) return 'Can’t find the data repo with this token.';
  return 'GitHub answered with an error ('+status+'). Will try again later.';
}
function setSyncView(kind,msg){syncView={kind:kind,msg:msg||''};renderSyncInfo();renderBackupInfo();}
function relTime(t){
  var s=Math.max(0,Math.round((Date.now()-t)/1000));
  if(s<60) return 'just now';
  if(s<3600){var m=Math.round(s/60);return m+' min ago';}
  if(s<86400){var hr=Math.round(s/3600);return hr+(hr===1?' hour ago':' hours ago');}
  return fmtDate(t);
}
function renderSyncInfo(){
  var el=$('#syncInfo');if(!el) return;
  if(!canSave){el.replaceChildren();return;}
  var cfg=getSync();
  var open=function(){openSyncSheet();};
  el.className='syncinfo'+(syncView.kind==='err'?' err':'');
  if(!cfg){el.replaceChildren(h('button',{class:'linklike',type:'button',onclick:open},'Set up sync'),' to see the same list on your other devices.');return;}
  var txt;
  if(syncView.kind==='busy') txt='Syncing…';
  else if(syncView.kind==='err') txt='Sync problem: '+syncView.msg;
  else if(syncView.kind==='offline') txt='Offline. Will sync when you’re back online.';
  else txt=cfg.last?'Synced '+relTime(cfg.last)+'.':'Sync is on.';
  el.replaceChildren(txt+' ',h('button',{class:'linklike',type:'button',onclick:open},'Sync settings'));
}
function scheduleSync(ms){
  if(!getSync()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){syncNow();},ms==null?2500:ms);
}
async function syncNow(){
  var cfg=getSync();
  if(!cfg||!canSave) return false;
  if(syncing){syncAgain=true;return false;}
  syncing=true;clearTimeout(syncTimer);setSyncView('busy');
  var good=false;
  try{
    for(var attempt=0;attempt<4&&!good;attempt++){
      var r=await ghFetch(cfg,'/contents/'+SYNCFILE);
      var remote={items:[],deleted:{items:{},entries:{}}},sha=null;
      if(r.status===200){
        var j=await r.json();sha=j.sha;
        var txt=j.content?b64dec(j.content):'';
        if(txt.trim()){var p=JSON.parse(txt);remote={items:normalize(p),deleted:normalizeDeleted(p)};}
      }else if(r.status!==404){setSyncView('err',syncProblem(r.status));break;}
      /* no awaits between reading the local list and replacing it */
      var local={items:state.items,deleted:state.deleted};
      var merged=mergeData(local,remote);
      var mergedTxt=canonical(merged);
      if(mergedTxt!==canonical(local)){
        state.items=merged.items;state.deleted=merged.deleted;
        if(ui.open&&!byId(ui.open)) ui.open=null;
        save(true);
        renderIfIdle();
      }
      if(mergedTxt===canonical(remote)){good=true;break;}
      var body={message:'Sync from '+(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Mac/.test(navigator.userAgent)?'Mac':'a device'),
        content:b64enc(JSON.stringify({v:1,items:merged.items,deleted:merged.deleted},null,1))};
      if(sha) body.sha=sha;
      var w=await ghFetch(cfg,'/contents/'+SYNCFILE,{method:'PUT',body:JSON.stringify(body)});
      if(w.status===200||w.status===201){good=true;break;}
      if(w.status===409||w.status===422) continue; /* another device got there first: merge again */
      setSyncView('err',syncProblem(w.status));break;
    }
    if(good){
      var c2=getSync();
      if(c2){c2.last=Date.now();setSync(c2);}
      setSyncView('ok');
    }else if(syncView.kind==='busy') setSyncView('err','Two devices kept saving at once. Will try again.');
  }catch(e){
    setSyncView(navigator.onLine===false?'offline':'err','Couldn’t reach GitHub. Will try again.');
  }
  syncing=false;
  if(syncAgain){syncAgain=false;scheduleSync(600);}
  return good;
}
function defaultRepo(){
  var m=/^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);
  return (m?m[1]:'your-username')+'/last-time-data';
}
function openSyncSheet(){
  var cfg=getSync();
  if(cfg){
    openSheet(h('div',{class:'sheetbody'},
      h('h2',null,'Sync is on'),
      h('p',{class:'sub'},'This device shares its list through your private repo '+cfg.repo+'.'),
      h('p',{class:'muted',style:'margin:0;font-size:14px'},cfg.last?'Last synced '+relTime(cfg.last)+'.':'Not synced yet.'),
      h('div',{class:'btnrow'},
        h('button',{class:'btn primary',type:'button',onclick:function(){closeSheet();syncNow().then(function(ok){if(ok) toast('Synced');});}},'Sync now'),
        h('button',{class:'btn',type:'button',onclick:closeSheet},'Close')),
      h('button',{class:'linklike',type:'button',style:'justify-self:start',onclick:function(){
        setSync(null);setSyncView('idle');closeSheet();toast('Sync turned off on this device. Your list is still here.');
      }},'Turn off sync on this device')));
    return;
  }
  var repoIn=h('input',{type:'text',value:defaultRepo(),autocomplete:'off',autocapitalize:'none',spellcheck:'false'});
  var tokIn=h('input',{type:'password',placeholder:'github_pat_…',autocomplete:'off',autocapitalize:'none',spellcheck:'false'});
  var msg=h('p',{class:'status err',role:'alert',style:'margin:0;font-size:14px;min-height:20px'});
  var go=h('button',{class:'btn primary',type:'button',onclick:connect},'Connect');
  async function connect(){
    var repo=repoIn.value.trim().replace(/^https:\/\/github\.com\//,'').replace(/\/+$/,''),token=tokIn.value.trim();
    if(!/^[^\/\s]+\/[^\/\s]+$/.test(repo)){msg.textContent='The repo should look like username/last-time-data.';return;}
    if(!token){msg.textContent='Paste the token first.';tokIn.focus();return;}
    go.disabled=true;msg.textContent='';go.textContent='Checking…';
    try{
      var r=await ghFetch({repo:repo,token:token},'');
      if(r.status!==200){msg.textContent=syncProblem(r.status);}
      else{
        var info=await r.json();
        if(info.private!==true){msg.textContent='That repo is public, so anyone could read your list. Make it private first.';}
        else{
          setSync({repo:repo,token:token,last:0});
          closeSheet();
          var ok=await syncNow();
          if(ok) toast('Sync is on');
          return;
        }
      }
    }catch(e){msg.textContent='Couldn’t reach GitHub. Check your connection and try again.';}
    go.disabled=false;go.textContent='Connect';
  }
  openSheet(h('div',{class:'sheetbody'},
    h('h2',null,'Set up sync'),
    h('p',{class:'sub'},'Your list is kept in a private GitHub repo that only you can open. Do this once on each device.'),
    h('label',{class:'field'},h('span',null,'Private data repo'),repoIn),
    h('label',{class:'field'},h('span',null,'Access token (stays on this device)'),tokIn),
    msg,
    h('div',{class:'btnrow'},go,h('button',{class:'btn',type:'button',onclick:closeSheet},'Cancel'))));
}

/* a synced change never redraws the list under your fingers while you type */
var stale=false;
function renderIfIdle(){
  var ae=document.activeElement;
  if(sheet.open||(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))){stale=true;return;}
  stale=false;render();
}
function catchUp(){setTimeout(function(){if(stale) renderIfIdle();},60);}
sheet.addEventListener('close',catchUp);
document.addEventListener('focusout',catchUp);

/* ---------- boot ---------- */
function refresh(){
  var ae=document.activeElement;
  if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  dateEl.max=isoDate(Date.now());
  render();
}
function boot(){
  var res=readLocal();
  if(!res.ok){
    $('#list').replaceChildren(h('div',{class:'banner'},'Couldn’t read your saved list. Nothing has been changed. Restore from a backup, or reload.'));
    $('#foot').replaceChildren();
    $('#foot').append(h('button',{class:'linklike',type:'button',onclick:function(){$('#restoreFile').click();}},'Restore backup'));
    return;
  }
  state.items=res.items;
  state.deleted=res.deleted;
  canSave=true;
  render();
  syncNow();
  /* home-screen shortcut (where the phone supports it) opens straight into quick log */
  try{
    if(/[?&]quick=1/.test(location.search)){
      history.replaceState(null,'',location.pathname);
      openQuickSheet();
    }
  }catch(e){}
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){refresh();syncNow();}});
window.addEventListener('online',function(){syncNow();});
setInterval(function(){if(document.visibilityState==='visible') renderSyncInfo();},60000);
window.addEventListener('pageshow',function(e){if(e.persisted) refresh();});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}

boot();
})();
</script>
